version: 2
models:
  pro: gpt-5.2-pro
  codex: gpt-5.2-codex
routing:
  plan: pro
  audit: pro
  task_type:
    code: codex
    derivation: pro
    writing: pro
    literature: pro
    meta: pro
    experiment:
      design: pro
      run: codex
fallback_chains:
  pro:
  - gpt-5.2-pro
  - gpt-5-pro
  - gpt-5.2
  - gpt-5.1
  - gpt-5
  - gpt-5-mini
  codex:
  - gpt-5.2-codex
  - gpt-5.1-codex-max
  - gpt-5.1-codex
  - gpt-5-codex
  - gpt-5.2
  - gpt-5-mini
effort_by_route:
  pro: xhigh
  codex: xhigh
  hard_limit: high
hard_limit_model: gpt-5-mini
price_per_1m_input_usd: 10.0
price_per_1m_output_usd: 30.0
price_per_1m_cached_input_usd: 2.5
prompting:
  default_response_profile:
    plan: qa_zh
    audit: audit_cn
    task: qa_zh
  default_budget_profile: high
  budget_profiles:
    high:
      target_tokens: 12000
      soft_limit_tokens: 18000
      hard_limit_tokens: 24000
    medium:
      target_tokens: 8000
      soft_limit_tokens: 12000
      hard_limit_tokens: 16000
    low:
      target_tokens: 5000
      soft_limit_tokens: 8000
      hard_limit_tokens: 12000
  viz_policy:
    auto_on_commands:
    - audit
    auto_on_task_types:
    - experiment
  math_rigor_default: strict
  step_visibility: layered_appendix
  artifact_contract: full_evidence_pack
notes: Do not store API key here. Put key in state/AI_SECRETS.local.yaml or OPENAI_API_KEY env.
